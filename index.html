<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="gallery-container">
        <p class="tagline">A WORLD OF VISUALS</p>
        <h1>Image Gallery</h1>
        <p class="subtitle">Little moments. Beautiful perspectives.</p>

        <section class="gallery" aria-label="Image gallery">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=700" alt="Mountain lake surrounded by green hills">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=700" alt="Sunlight falling across a scenic landscape">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=700" alt="Golden sunrise over a peaceful field">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=700" alt="Sunlight shining through a green forest">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=700" alt="Beautiful mountain scenery beside a lake">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=700" alt="Tall mountains beneath a cloudy sky">
            <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=700" alt="Ocean waves rolling toward the shore">
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=700" alt="Green countryside under a bright sky">
        </section>

        <p class="footer">Explore • Discover • Remember</p>
    </main>

    <div class="lightbox" id="lightbox" role="dialog"
         aria-modal="true" aria-label="Image preview" hidden>
        <button class="close-btn" id="close-btn" aria-label="Close preview">&times;</button>
        <img id="preview-image" src="" alt="">
    </div>

    <script src="script.js"></script>
</body>
</html>
